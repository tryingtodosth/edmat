[package]
name = "edmat-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `bundled` compiles SQLite from the vendored amalgamation — this sandbox has gcc but no
# libsqlite3-dev headers, and a pinned SQLite version is the more reproducible choice anyway.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
