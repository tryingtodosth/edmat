# ============================================================================
# EdMat — Apache vhost config for webek4.fuw.edu.pl / edmat.net
# ============================================================================
# ASSUMED deployment paths — this file was written from this sandbox's own inspection of the
# venv's baked-in pyvenv.cfg ("command = /usr/bin/python3 -m venv /home/todoonet/todonet/backend/
# .venv"), not confirmed live on the real machine. If the real layout differs, only the four
# `Define` lines below need changing — every other directive is written in terms of them.
#
# Prerequisites this file assumes are ALREADY done — see ../DEPLOYMENT.md for the full, ordered
# command sequence:
#   1. DNS: edmat.net + www.edmat.net A records point directly at 193.0.80.55 (this box) —
#      replacing OVH's own "web redirection" product, per the decision made before this file was
#      written (see DEPLOYMENT.md step 1).
#   2. A real mod_wsgi.so has been compiled for THIS venv's own Python 3.12 and loaded into Apache
#      (DEPLOYMENT.md step 3 — mod_wsgi-express install-module's own output).
#   3. certbot has issued a certificate covering edmat.net, www.edmat.net, AND webek4.fuw.edu.pl
#      (DEPLOYMENT.md step 4) at the standard /etc/letsencrypt/live/edmat.net/ path.
#   4. `manage.py collectstatic` has been run at least once (DEPLOYMENT.md step 6).
#
# Required Apache modules — `a2enmod rewrite ssl headers` (wsgi is loaded separately, see step 3).
# `headers` is genuinely required, not optional: Apache FAILS TO START on the first `Header`
# directive if mod_headers is not loaded. A `configtest` reporting `Invalid command 'Header'` means
# exactly this and nothing else.
# ============================================================================

Define EDMAT_ROOT /home/todoonet/todonet
Define EDMAT_BACKEND ${EDMAT_ROOT}/backend
Define EDMAT_FRONTEND_BUILD ${EDMAT_ROOT}/frontend/build
Define EDMAT_VENV ${EDMAT_BACKEND}/.venv

# ----------------------------------------------------------------------------------------------
# Port 80 — serves ONLY the ACME (Let's Encrypt) challenge path; everything else redirects to
# HTTPS. Keeping this alive (rather than closing port 80 entirely) is what lets certbot's own
# automatic renewal keep working without any manual steps every ~60 days.
# ----------------------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName edmat.net
    ServerAlias www.edmat.net webek4.fuw.edu.pl

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://edmat.net%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/edmat_http_error.log
</VirtualHost>

# ----------------------------------------------------------------------------------------------
# Port 443 — webek4.fuw.edu.pl: the university hostname stays reachable (anyone with it bookmarked
# or linked doesn't hit a dead end) but always redirects on to the real, canonical public domain —
# one canonical origin means one set of cookies/sessions, not two silently-separate ones.
# ----------------------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName webek4.fuw.edu.pl

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/edmat.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/edmat.net/privkey.pem

    RewriteEngine On
    RewriteRule ^ https://edmat.net%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/edmat_webek4_redirect_error.log
</VirtualHost>

# ----------------------------------------------------------------------------------------------
# Port 443 — the real app: edmat.net / www.edmat.net
# ----------------------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName edmat.net
    ServerAlias www.edmat.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/edmat.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/edmat.net/privkey.pem

    # --- security headers -----------------------------------------------------------------------
    # REQUIRES `a2enmod headers`. Without that module Apache refuses to start on the first `Header`
    # directive, so enable it BEFORE reloading — see DEPLOYMENT.md step 3.
    #
    # These have to live here rather than in Django, and that is the entire point of this block.
    # Django's own `SecurityMiddleware` already sets equivalent headers correctly — but it can only
    # set them on responses DJANGO GENERATES, which in this vhost means `/api/` and `/admin/` and
    # nothing else. The application a visitor actually looks at is the SvelteKit build served
    # straight off disk by `DocumentRoot` below, plus `/static/` and `/media/` — none of which pass
    # through Django at all. So without this, the real site had no clickjacking protection, no
    # MIME-sniffing protection and no referrer policy on a single one of its own pages, while
    # `manage.py check --deploy` still reported everything as fine. That check was not wrong; it
    # was answering only for the responses it knows about, which here are the minority.
    #
    # `always` is load-bearing: the plain form applies only to 2xx/3xx responses, so error pages
    # would otherwise ship without any of these.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # SAMEORIGIN rather than DENY: DENY would also stop this site framing its OWN pages, and
    # nothing here needs framing by anyone else. Both headers are set on purpose —
    # `frame-ancestors` is the modern replacement that older browsers ignore, and
    # `X-Frame-Options` is the legacy one newer browsers still honour when no CSP is present.
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "frame-ancestors 'self'"

    # Deliberately NOT a full `default-src` CSP. A real content policy for this app has to be
    # derived from what the SPA genuinely loads — KaTeX's fonts, Leaflet's OpenStreetMap tiles from
    # tile.openstreetmap.org, and the inline theme script in app.html that exists precisely to run
    # before first paint — and a CSP guessed rather than measured breaks exactly those things, in a
    # way that reads as an unrelated bug rather than as a policy violation. Worth its own pass with
    # the browser console open. `frame-ancestors` is safe to set today because it constrains only
    # who may frame this site, never what this site may load.

    # --- static frontend (SvelteKit, adapter-static build) --------------------------------------
    DocumentRoot ${EDMAT_FRONTEND_BUILD}
    <Directory ${EDMAT_FRONTEND_BUILD}>
        Require all granted
        # svelte.config.js's own `fallback: '200.html'` (SPA mode) — any route that isn't a real
        # static file (an exercise/course/field detail page, any client-side-only route) falls
        # back to 200.html, which bootstraps the SPA's own client-side router. This is the direct
        # Apache equivalent of the "SPA fallback" behavior every other host (Nginx's try_files,
        # Netlify's _redirects, etc.) needs its own dedicated mechanism for too.
        FallbackResource /200.html
    </Directory>

    # --- Django admin's + DRF's own static assets (collected via `manage.py collectstatic`) -----
    Alias /static/ ${EDMAT_BACKEND}/staticfiles/
    <Directory ${EDMAT_BACKEND}/staticfiles/>
        Require all granted
    </Directory>

    # --- user-uploaded material files (exams/tests/etc., Section 9/17N) ------------------------
    Alias /media/ ${EDMAT_BACKEND}/media/
    <Directory ${EDMAT_BACKEND}/media/>
        Require all granted
        # Real content-type sniffing + an optional malware scan already happen at UPLOAD time
        # (materials/validators.py) — this doesn't re-check anything, it's just the plain static
        # file serving every uploaded PDF/image/document needs once DEBUG=False turns off
        # Django's own dev-time media auto-serving.

        # This directory is different in kind from every other path in this vhost: its contents are
        # supplied by users, and they are served from the SAME ORIGIN as the application. Anything
        # a browser can be persuaded to execute here runs with the site's own origin — meaning
        # access to its cookies and its DOM — so the upload-time validation is worth reinforcing at
        # serve time, where the guarantee is about how the browser TREATS the bytes rather than
        # about what the bytes are.
        #
        # `attachment` is the substantive control: it makes the browser download the file rather
        # than render it inline, so a file that slipped through validation as some renderable type
        # cannot execute in this origin. Downloads still work exactly as before — every link to
        # these files (MaterialCard's own download link) already means "give me this file".
        Header always set Content-Disposition "attachment"

        # `sandbox` drops the file into an opaque origin if it is ever rendered anyway (a direct
        # navigation, an embed), so scripts in it cannot reach this site's cookies or storage.
        # Overrides the frame-ancestors policy set above for this directory only.
        Header always set Content-Security-Policy "sandbox; default-src 'none'"

        # Belt and braces alongside the vhost-wide nosniff: without it a browser may second-guess
        # the declared type and render, say, a text/plain upload as HTML.
        Header always set X-Content-Type-Options "nosniff"
    </Directory>

    # --- the Django API + admin, via mod_wsgi ---------------------------------------------------
    # Django's own urls.py already hardcodes the `api/`/`admin/` prefixes INSIDE its own urlpatterns
    # (matching exactly how `manage.py runserver` already serves it today, mounted at the root,
    # completely unmodified) — Django's URL resolver matches against PATH_INFO alone (confirmed by
    # direct testing against this exact Django version, not assumed), so it needs to receive the
    # FULL original path (`/api/fields/`, not just `/fields/`) as PATH_INFO. A plain, naive
    # `WSGIScriptAlias /api ...` would NOT do that — mod_wsgi's own WSGIScriptAlias directive sets
    # SCRIPT_NAME to the mount prefix and STRIPS it from PATH_INFO (standard WSGI/CGI script-alias
    # semantics), which would leave Django trying to match `/fields/` against a urlconf that expects
    # `api/fields/` — a 404 on every single API request. The fix used here is the standard,
    # well-documented workaround for exactly this "app hardcodes its own prefix" situation: an
    # internal-only marker segment. mod_rewrite rewrites the externally-visible `/api/...`/
    # `/admin/...` URL into `/wsgi-app/api/...`/`/wsgi-app/admin/...` (the ORIGINAL path is fully
    # preserved, unchanged, inside the new URL) and WSGIScriptAlias only strips the `/wsgi-app`
    # marker itself — so the PATH_INFO Django actually receives is exactly `/api/...`/`/admin/...`,
    # matching urls.py with zero code changes anywhere.
    WSGIDaemonProcess edmat python-home=${EDMAT_VENV} python-path=${EDMAT_BACKEND} processes=2 threads=4
    WSGIProcessGroup edmat

    # NOT optional, and its absence produces a bug that looks like anything but a config problem.
    # mod_wsgi does not pass the `Authorization` header through to the application by default —
    # Apache reserves it for its own auth handling — so without this line Django never receives it.
    # This app authenticates every logged-in request with DRF `TokenAuthentication`, i.e. with
    # exactly that header, so the symptom is: anonymous browsing works perfectly, logging in works
    # (credentials travel in the POST body, no Authorization header involved), and then every
    # authenticated request 401s. The frontend's `authStore.init()` cannot tell a rejected token
    # from a header that never arrived — it clears the session on any failure — so the whole thing
    # presents as "refreshing the page logs me out", with the token sitting visibly in the request
    # headers in devtools the entire time.
    #
    # Told apart by the response body LENGTH, not by guessing: a header that never arrived gives
    # DRF's 58-byte {"detail":"Authentication credentials were not provided."}, whereas a genuinely
    # bad token gives the 27-byte {"detail":"Invalid token."}. Found on the real webek4 deployment,
    # where every login appeared to succeed and no request ever stayed authenticated.
    WSGIPassAuthorization On

    WSGIScriptAlias /wsgi-app ${EDMAT_BACKEND}/config/wsgi.py process-group=edmat application-group=%{GLOBAL}

    RewriteEngine On
    RewriteRule ^/((api|admin)/.*)$ /wsgi-app/$1 [PT]

    <Directory ${EDMAT_BACKEND}/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/edmat_error.log
    CustomLog ${APACHE_LOG_DIR}/edmat_access.log combined
</VirtualHost>
