# Stage 1 ONLY — enable this file first, get the certificate, THEN switch to the real edmat.conf.
#
# Why this file exists at all: edmat.conf's own two :443 VirtualHost blocks reference certificate
# files (/etc/letsencrypt/live/edmat.net/fullchain.pem etc.) that don't exist yet on a fresh box —
# Apache refuses to start (or reload) ANY config that references a missing certificate file, even
# for a vhost you're not currently testing. So the real cert has to be issued BEFORE edmat.conf's
# full version can ever be loaded. This file is exactly edmat.conf's own port-80 vhost, standing in
# on its own just long enough for certbot's webroot challenge to succeed — see ../DEPLOYMENT.md
# step 5.

Define EDMAT_ROOT /home/todoonet/todonet

<VirtualHost *:80>
    ServerName edmat.net
    ServerAlias www.edmat.net webek4.fuw.edu.pl

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/edmat_http_error.log
</VirtualHost>
