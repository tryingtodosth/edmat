<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Phase 4 hardening: a real favicon (the header's own "∫" brand mark, static/favicon.svg) —
		     its absence was surfaced by the accessibility checker's own page-load-error guard (every
		     browser implicitly probes /favicon.ico on first navigation to a new origin, and a genuine
		     404 there logs a real console error that check_accessibility.ts correctly flags). -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Applied before any CSS/JS bundle loads, so the very first paint already has the
			// right theme — without this, a dark-preferring visitor sees a flash of the light
			// theme (the SSR/no-JS default) on every load. Kept tiny and dependency-free; see
			// lib/state/theme.svelte.ts for the reactive engine this bootstraps into on hydration.
			(function () {
				try {
					var stored = localStorage.getItem('edmat-theme');
					var resolved =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', resolved);
				} catch (e) {
					// localStorage/matchMedia can throw in a locked-down context — the CSS-only
					// :root/@media fallback in _theme.scss still applies.
				}
			})();
			// Same trick, same reason, for the session. The server cannot know whether a visitor is
			// signed in — there is no server `load` and the token lives in localStorage — so the
			// server-rendered HTML necessarily says "signed out", and nothing corrects it until the
			// JS bundle has loaded, hydrated and `/auth/me/` has answered. Measured on the dev
			// server after a locale switch: the signed-out header was on screen from 200ms and the
			// request that would have contradicted it was not even SENT until 2617ms. So a signed-in
			// person watched the app claim they were logged out for two and a half seconds.
			//
			// The presence of a token is knowable here, before the first paint, with no bundle and
			// no round trip. It says only "a session is being restored" — never who, and never with
			// what permissions, both of which stay entirely with the real /auth/me/ answer. A
			// genuine guest has no token, gets no attribute, and still sees Log in immediately.
			// Cleared by lib/state/auth.svelte.ts the moment the real answer arrives, either way.
			(function () {
				try {
					if (localStorage.getItem('edmat-auth-token'))
						document.documentElement.setAttribute('data-session', 'restoring');
				} catch (e) {
					// Same locked-down-context caveat as above: without the attribute the app just
					// behaves as it did before, which is a worse first paint rather than a broken one.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- The boot shell — what a route that is NOT prerendered paints while the JS bundle is still
		     downloading. SvelteKit's SPA fallback (200.html) ships an EMPTY body div, so until the
		     module graph has booted the page is blank: First Contentful Paint was measured at "whenever
		     the bundle finished", not at HTML arrival. This is a real brand bar (a working link) and a
		     loading line, painted from the HTML alone. It is hidden by CSS the instant the div above has
		     content other than SvelteKit's own bootstrap script (which sits INSIDE that div in the fallback,
		     and matched a bare `> *` — the shell never showed until that was excluded) — at build time
		     on a prerendered page, at hydration on a fallback one — so no page
		     ever shows two headers, and nothing here has to be torn down by script. Plain inline
		     styles with fallbacks: the theme variables it reads come from the stylesheet linked in
		     <head>, which is also at first paint. -->
		<div class="boot-shell" aria-hidden="true">
			<div class="boot-shell__bar"><a class="boot-shell__brand" href="/">∫ EdMat</a></div>
			<p class="boot-shell__loading">…</p>
		</div>
		<style>
			body:has(> div[style] > :not(script)) > .boot-shell {
				display: none;
			}
			.boot-shell__bar {
				height: 60px;
				display: flex;
				align-items: center;
				padding: 0 clamp(12px, 3vw, 28px);
				background: var(--bg-surface, #ffffff);
				border-bottom: 1px solid var(--border-color, #e3e5ec);
			}
			.boot-shell__brand {
				font-weight: 700;
				font-size: 1.25rem;
				color: var(--text-primary, #1a1c26);
				text-decoration: none;
			}
			.boot-shell__loading {
				max-width: 780px;
				margin: 24px auto;
				padding: 0 16px;
				color: var(--text-secondary, #5a5f73);
				letter-spacing: 0.3em;
			}
		</style>
	</body>
</html>
